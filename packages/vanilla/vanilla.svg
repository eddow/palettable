<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for a rich, modern look -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e24"/>
      <stop offset="100%" stop-color="#111116"/>
    </linearGradient>
    
    <!-- Vanilla Cream Petal Gradient -->
    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8eb"/>
      <stop offset="100%" stop-color="#f0d8b5"/>
    </linearGradient>

    <!-- Vanilla Pod / Accent Gradient -->
    <linearGradient id="podGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5c3a21"/>
      <stop offset="100%" stop-color="#2d1c0f"/>
    </linearGradient>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>

  <!-- Vanilla Flower Petals (Orchid-like arrangement) -->
  <g transform="translate(32, 32)">
    <!-- Back Petals -->
    <ellipse cx="0" cy="-14" rx="5" ry="12" fill="url(#petalGrad)" opacity="0.85" transform="rotate(0)"/>
    <ellipse cx="0" cy="-14" rx="5" ry="12" fill="url(#petalGrad)" opacity="0.85" transform="rotate(72)"/>
    <ellipse cx="0" cy="-14" rx="5" ry="12" fill="url(#petalGrad)" opacity="0.85" transform="rotate(144)"/>
    <ellipse cx="0" cy="-14" rx="5" ry="12" fill="url(#petalGrad)" opacity="0.85" transform="rotate(216)"/>
    <ellipse cx="0" cy="-14" rx="5" ry="12" fill="url(#petalGrad)" opacity="0.85" transform="rotate(288)"/>

    <!-- Inner Labellum / Trumpet Center -->
    <path d="M 0 -8 C 5 -8, 8 -3, 6 4 C 4 10, 0 14, 0 16 C 0 14, -4 10, -6 4 C -8 -3, -5 -8, 0 -8 Z" fill="#fffdfa" stroke="#e0c299" stroke-width="0.75"/>

    <!-- Vanilla Pod Crossing Behind/Through the Center -->
    <path d="M -16 18 Q -2 -2 18 -16" stroke="url(#podGrad)" stroke-width="2" stroke-linecap="round" fill="none"/>
    
    <!-- Core Center Stamen / Dot -->
    <circle cx="0" cy="1" r="2.5" fill="#d4a373"/>
  </g>
</svg>
